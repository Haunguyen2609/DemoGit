services:
  # ── MongoDB ──────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: shopdb-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: shopdb
    volumes:
      - mongo_data:/data/db
    networks:
      - shopdb-network

  # ── Backend (Node.js + Express) ───────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopdb-backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/shopdb
      PORT: 5000
      JWT_SECRET: supersecretjwt2024shopkey
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    networks:
      - shopdb-network

  # ── Frontend (Nginx serving static HTML) ─────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shopdb-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - shopdb-network

volumes:
  mongo_data:

networks:
  shopdb-network:
    driver: bridge
