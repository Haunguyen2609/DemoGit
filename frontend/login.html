<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập – ShopDB</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar-container"></div>
  <div class="form-page">
    <div class="form-card">
      <div class="form-brand">
        <div class="logo-big">🛒</div>
        <h2>Chào mừng trở lại!</h2>
        <p>Đăng nhập để tiếp tục mua sắm</p>
      </div>

      <div id="error-msg" style="display:none;background:rgba(239,68,68,0.1);border:1px solid var(--danger);border-radius:var(--radius);padding:10px 14px;font-size:0.85rem;color:var(--danger);margin-bottom:16px"></div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="email@example.com" required>
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-form" id="btn-login">Đăng nhập</button>
      </form>

      <div style="margin-top:16px;padding:12px;background:var(--bg-secondary);border-radius:var(--radius);font-size:0.78rem;color:var(--text-muted)">
        <strong>Demo tài khoản:</strong><br>
        👑 Admin: admin@shopdb.vn / admin123<br>
        👤 User: demo@shopdb.vn / user123
      </div>

      <div class="form-link">Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></div>
      <div class="form-link" style="margin-top:8px"><a href="index.html">← Về trang chủ</a></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('navbar-container').innerHTML = renderNavbar('login');
    if (auth.isLoggedIn()) window.location.href = 'index.html';

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const errEl = document.getElementById('error-msg');
      btn.disabled = true; btn.textContent = '⏳ Đang đăng nhập...';
      errEl.style.display = 'none';

      try {
        const { data, token } = await api.post('/auth/login', {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        });
        auth.save(data, token);
        toast('success', `Xin chào, ${data.name}!`);
        setTimeout(() => window.location.href = 'index.html', 800);
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Đăng nhập';
      }
    }
  </script>
</body>
</html>
