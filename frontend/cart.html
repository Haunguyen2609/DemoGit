<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giỏ hàng – ShopDB</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar-container"></div>
  <main class="container" style="padding-top:32px;padding-bottom:64px">
    <h1 style="font-size:1.6rem;font-weight:800;margin-bottom:24px">🛒 Giỏ hàng của bạn</h1>
    <div id="cart-container"></div>
  </main>
  <div id="footer-container"></div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('navbar-container').innerHTML = renderNavbar();
    document.getElementById('footer-container').innerHTML = renderFooter();

    function renderCart() {
      const items = cart.get();
      const container = document.getElementById('cart-container');
      if (!items.length) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🛒</div>
            <h3>Giỏ hàng trống</h3>
            <p>Hãy khám phá sản phẩm và thêm vào giỏ hàng</p>
            <a href="index.html" class="btn-hero-primary">🛍️ Mua sắm ngay</a>
          </div>`;
        return;
      }

      const subtotal = cart.total();
      const shipping = subtotal >= 500000 ? 0 : 30000;
      const total = subtotal + shipping;

      container.innerHTML = `
        <div class="cart-layout">
          <div class="cart-items">
            ${items.map(item => `
              <div class="cart-item" id="item-${item._id}">
                <img src="${item.image || 'https://picsum.photos/80/80'}" alt="${item.name}" onerror="this.src='https://picsum.photos/80/80'">
                <div class="cart-item-info">
                  <div class="cart-item-name">${item.name}</div>
                  <div class="cart-item-price">${formatPrice(item.price)}</div>
                </div>
                <div class="qty-control">
                  <button class="qty-btn" onclick="updateQty('${item._id}', ${item.qty - 1})">−</button>
                  <span class="qty-val">${item.qty}</span>
                  <button class="qty-btn" onclick="updateQty('${item._id}', ${item.qty + 1})">+</button>
                </div>
                <div style="font-weight:700;min-width:90px;text-align:right;color:var(--accent-light)">${formatPrice(item.price * item.qty)}</div>
                <button class="btn-remove" onclick="removeItem('${item._id}')" title="Xóa">🗑️</button>
              </div>
            `).join('')}
            <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0">
              <a href="index.html" style="color:var(--accent-light);text-decoration:none;font-size:0.85rem;font-weight:600">← Tiếp tục mua sắm</a>
              <button onclick="clearCartConfirm()" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:0.85rem;font-weight:600">🗑️ Xóa tất cả</button>
            </div>
          </div>

          <div class="cart-summary">
            <div class="summary-title">📋 Tóm tắt đơn hàng</div>
            <div class="summary-row">
              <span class="label">Tạm tính (${cart.count()} sản phẩm)</span>
              <span>${formatPrice(subtotal)}</span>
            </div>
            <div class="summary-row">
              <span class="label">Phí giao hàng</span>
              <span style="color:${shipping === 0 ? 'var(--success)' : 'inherit'}">${shipping === 0 ? 'Miễn phí' : formatPrice(shipping)}</span>
            </div>
            ${subtotal < 500000 ? `<div style="font-size:0.75rem;color:var(--text-muted);padding:6px 0">Mua thêm ${formatPrice(500000 - subtotal)} để được miễn phí giao hàng</div>` : ''}
            <div class="summary-row total">
              <span class="label">Tổng cộng</span>
              <span>${formatPrice(total)}</span>
            </div>
            <a href="checkout.html" class="btn-checkout">Đặt hàng ngay →</a>
            <div style="text-align:center;margin-top:14px;font-size:0.75rem;color:var(--text-muted)">🔒 Thanh toán an toàn & bảo mật</div>
          </div>
        </div>`;
      updateCartBadge();
    }

    function updateQty(id, qty) {
      if (qty < 1) { removeItem(id); return; }
      cart.updateQty(id, qty);
      renderCart();
    }

    function removeItem(id) {
      cart.remove(id);
      renderCart();
    }

    function clearCartConfirm() {
      if (confirm('Xóa toàn bộ giỏ hàng?')) { cart.clear(); renderCart(); }
    }

    renderCart();
  </script>
</body>
</html>
