<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký – ShopDB</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar-container"></div>
  <div class="form-page">
    <div class="form-card">
      <div class="form-brand">
        <div class="logo-big">🛒</div>
        <h2>Tạo tài khoản</h2>
        <p>Đăng ký để trải nghiệm mua sắm tốt hơn</p>
      </div>

      <div id="error-msg" style="display:none;background:rgba(239,68,68,0.1);border:1px solid var(--danger);border-radius:var(--radius);padding:10px 14px;font-size:0.85rem;color:var(--danger);margin-bottom:16px"></div>

      <form id="register-form" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Họ và tên</label>
          <input type="text" id="name" placeholder="Nguyễn Văn A" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="email@example.com" required>
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" id="password" placeholder="Tối thiểu 6 ký tự" minlength="6" required>
        </div>
        <div class="form-group">
          <label>Xác nhận mật khẩu</label>
          <input type="password" id="confirm-password" placeholder="Nhập lại mật khẩu" required>
        </div>
        <button type="submit" class="btn-form" id="btn-register">Tạo tài khoản</button>
      </form>

      <div class="form-link">Đã có tài khoản? <a href="login.html">Đăng nhập</a></div>
      <div class="form-link" style="margin-top:8px"><a href="index.html">← Về trang chủ</a></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('navbar-container').innerHTML = renderNavbar();
    if (auth.isLoggedIn()) window.location.href = 'index.html';

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-register');
      const errEl = document.getElementById('error-msg');
      errEl.style.display = 'none';

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm-password').value;

      if (password !== confirm) {
        errEl.textContent = 'Mật khẩu xác nhận không khớp!';
        errEl.style.display = 'block'; return;
      }

      btn.disabled = true; btn.textContent = '⏳ Đang tạo tài khoản...';

      try {
        const { data, token } = await api.post('/auth/register', { name, email, password });
        auth.save(data, token);
        toast('success', `🎉 Đăng ký thành công! Chào ${data.name}!`);
        setTimeout(() => window.location.href = 'index.html', 900);
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Tạo tài khoản';
      }
    }
  </script>
</body>
</html>
