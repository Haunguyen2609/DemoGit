server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript;

    location /api/ {
        default_type application/json;
        return 503 '{"message":"Backend API chua duoc deploy cho moi truong nay."}';
    }

    location ~* /(docker-compose|compose)\.(yml|yaml)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
