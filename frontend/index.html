<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopDB – Mua sắm thông minh</title>
  <meta name="description" content="ShopDB - Trang mua sắm trực tuyến với hàng ngàn sản phẩm chính hãng, giá tốt nhất.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar-container"></div>

  <!-- MAIN CONTENT -->
  <main class="container">
    <!-- CATEGORIES -->
    <section class="section" id="categories">
      <div class="section-header">
        <h2 class="section-title">Danh mục <span>nổi bật</span></h2>
      </div>
      <div id="category-grid" class="category-grid">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </section>

    <!-- PRODUCTS -->
    <section class="section" id="products-section">
      <div class="section-header">
        <h2 class="section-title">Sản phẩm <span>đặc sắc</span></h2>
      </div>

      <!-- FILTER BAR -->
      <div class="filter-bar">
        <span class="filter-label">Lọc:</span>
        <button class="filter-btn active" id="filter-all" onclick="applyFilter('all')">Tất cả</button>
        <button class="filter-btn" id="filter-sale" onclick="applyFilter('sale')">🔥 Giảm giá</button>
        <button class="filter-btn" id="filter-new" onclick="applyFilter('new')">✨ Hàng mới</button>
        <div style="margin-left:auto;display:flex;gap:8px">
          <select class="filter-select" id="sort-select" onchange="applySort(this.value)">
            <option value="">Mới nhất</option>
            <option value="price_asc">Giá tăng dần</option>
            <option value="price_desc">Giá giảm dần</option>
            <option value="rating">Đánh giá cao</option>
            <option value="popular">Bán chạy</option>
          </select>
        </div>
      </div>

      <div id="product-grid" class="product-grid">
        <div class="loading" style="grid-column:1/-1"><div class="spinner"></div><p>Đang tải sản phẩm...</p></div>
      </div>
      <div id="pagination" class="pagination"></div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script src="js/api.js"></script>
  <script>
    const state = {
      page: 1, limit: 12,
      category: null, sort: '', isNew: null, isSale: null, search: null
    };

    // Init from URL params
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('search')) state.search = urlParams.get('search');
    if (urlParams.get('isNew')) state.isNew = true;
    if (urlParams.get('isSale')) state.isSale = true;
    if (urlParams.get('category')) state.category = urlParams.get('category');

    document.getElementById('navbar-container').innerHTML = renderNavbar();
    document.getElementById('footer-container').innerHTML = renderFooter();
    if (state.search) document.getElementById('nav-search').value = state.search;

    async function loadStats() {
      try {
        const [prods, cats] = await Promise.all([api.get('/products?limit=1'), api.get('/categories')]);
        document.getElementById('stat-products').textContent = prods.total.toLocaleString('vi-VN') + '+';
        document.getElementById('stat-categories').textContent = cats.data.length;
      } catch {}
    }

    async function loadCategories() {
      const grid = document.getElementById('category-grid');
      try {
        const { data } = await api.get('/categories');
        grid.innerHTML = `
          <div class="category-card ${!state.category ? 'active' : ''}" onclick="filterByCategory(null)">
            <span class="category-icon">🛍️</span>
            <div class="category-name">Tất cả</div>
            <div class="category-count">Xem tất cả</div>
          </div>
          ${data.map(c => `
            <div class="category-card ${state.category === c._id ? 'active' : ''}" onclick="filterByCategory('${c._id}')">
              <span class="category-icon">${c.icon}</span>
              <div class="category-name">${c.name}</div>
              <div class="category-count">${c.productCount} sản phẩm</div>
            </div>
          `).join('')}
        `;
      } catch (e) {
        grid.innerHTML = `<p style="color:var(--danger)">${e.message}</p>`;
      }
    }

    async function loadProducts() {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = `<div class="loading" style="grid-column:1/-1"><div class="spinner"></div><p>Đang tải...</p></div>`;

      try {
        let qs = `?page=${state.page}&limit=${state.limit}`;
        if (state.category) qs += `&category=${state.category}`;
        if (state.sort) qs += `&sort=${state.sort}`;
        if (state.isNew) qs += `&isNew=true`;
        if (state.isSale) qs += `&isSale=true`;
        if (state.search) qs += `&search=${encodeURIComponent(state.search)}`;

        const { data, total, pages } = await api.get(`/products${qs}`);
        if (!data.length) {
          grid.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1">
              <div class="empty-icon">🔍</div>
              <h3>Không tìm thấy sản phẩm</h3>
              <p>Thử tìm kiếm với từ khóa khác hoặc xóa bộ lọc</p>
              <button class="btn-hero-primary" onclick="applyFilter('all')">Xóa bộ lọc</button>
            </div>`;
          document.getElementById('pagination').innerHTML = '';
          return;
        }

        grid.innerHTML = data.map(p => `
          <div class="product-card" onclick="window.location.href='product.html?id=${p._id}'">
            <div class="product-img-wrap">
              <img src="${p.images[0]}" alt="${p.name}" loading="lazy" onerror="this.src='https://picsum.photos/seed/${Math.floor(Math.random()*999)}/600/600'">
              <div class="product-badge">
                ${p.isNew ? '<span class="badge badge-new">Mới</span>' : ''}
                ${p.isSale ? '<span class="badge badge-sale">Sale</span>' : ''}
              </div>
              <div class="product-actions">
                <button class="action-btn" title="Xem chi tiết" onclick="event.stopPropagation();window.location.href='product.html?id=${p._id}'">👁️</button>
                <button class="action-btn" title="Thêm vào giỏ" onclick="event.stopPropagation();quickAddCart('${p._id}')">🛒</button>
              </div>
            </div>
            <div class="product-info">
              <div class="product-category">${p.category?.name || ''}</div>
              <div class="product-name">${p.name}</div>
              <div class="product-rating">
                ${renderStars(p.rating)} <span>(${p.reviewCount})</span>
              </div>
              <div class="product-price">
                <span class="price-current">${formatPrice(p.price)}</span>
                ${p.originalPrice ? `<span class="price-original">${formatPrice(p.originalPrice)}</span>` : ''}
                ${p.originalPrice ? `<span class="price-discount">-${Math.round((1-p.price/p.originalPrice)*100)}%</span>` : ''}
              </div>
              <button class="btn-add-cart" onclick="event.stopPropagation();addToCart(${JSON.stringify(p).replace(/"/g,'&quot;')})">🛒 Thêm giỏ hàng</button>
            </div>
          </div>
        `).join('');

        renderPagination(pages, total);
      } catch (e) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">⚠️</div><h3>Lỗi tải sản phẩm</h3><p>${e.message}</p></div>`;
      }
    }

    function renderPagination(pages, total) {
      const el = document.getElementById('pagination');
      if (pages <= 1) { el.innerHTML = ''; return; }
      let html = `<button class="page-btn" onclick="changePage(${state.page-1})" ${state.page===1?'disabled':''}>←</button>`;
      for (let i = 1; i <= pages; i++) {
        if (i === 1 || i === pages || Math.abs(i - state.page) <= 2) {
          html += `<button class="page-btn ${i===state.page?'active':''}" onclick="changePage(${i})">${i}</button>`;
        } else if (Math.abs(i - state.page) === 3) {
          html += `<span style="color:var(--text-muted);padding:0 4px">...</span>`;
        }
      }
      html += `<button class="page-btn" onclick="changePage(${state.page+1})" ${state.page===pages?'disabled':''}>→</button>`;
      el.innerHTML = html;
    }

    function changePage(p) {
      state.page = p;
      loadProducts();
      document.getElementById('products-section').scrollIntoView({ behavior: 'smooth' });
    }

    function filterByCategory(id) {
      state.category = id; state.page = 1;
      document.querySelectorAll('.category-card').forEach(c => c.classList.remove('active'));
      event.currentTarget?.classList.add('active');
      loadProducts();
    }

    function applyFilter(type) {
      state.isNew = null; state.isSale = null; state.page = 1;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      if (type === 'sale') { state.isSale = true; document.getElementById('filter-sale').classList.add('active'); }
      else if (type === 'new') { state.isNew = true; document.getElementById('filter-new').classList.add('active'); }
      else document.getElementById('filter-all').classList.add('active');
      loadProducts();
    }

    function applySort(val) { state.sort = val; state.page = 1; loadProducts(); }

    const _productCache = {};
    async function getProduct(id) {
      if (_productCache[id]) return _productCache[id];
      const { data } = await api.get(`/products/${id}`);
      _productCache[id] = data;
      return data;
    }

    async function quickAddCart(id) {
      try {
        const p = await getProduct(id);
        cart.add(p, 1);
        updateCartBadge();
      } catch (e) { toast('error', e.message); }
    }

    function addToCart(p) {
      cart.add(p, 1);
      updateCartBadge();
    }

    // Set filter state from url
    if (state.isSale) { document.querySelector('#filter-all')?.classList.remove('active'); document.querySelector('#filter-sale')?.classList.add('active'); }
    if (state.isNew) { document.querySelector('#filter-all')?.classList.remove('active'); document.querySelector('#filter-new')?.classList.add('active'); }

    loadStats();
    loadCategories();
    loadProducts();
    updateCartBadge();
  </script>
</body>
</html>
